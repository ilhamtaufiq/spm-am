<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remi Counter - AMS Super APP</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <a href="/" style="text-decoration: none; color: inherit;"><h1>REMI COUNTER</h1></a>
                <div class="subtitle">LEADERBOARD PERMAINAN REMI</div>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" onclick="document.getElementById('newGameModal').style.display='flex'">+ GAME BARU</button>
                <a href="/" class="btn" style="background: white;">HUB</a>
            </div>
        </header>

        <div class="card" style="background: #fcd34d;">
            <h2 style="font-weight: 900; margin-bottom: 1.5rem;">RIWAYAT PERMAINAN</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>TANGGAL</th>
                            <th>STATUS</th>
                            <th>PEMENANG</th>
                            <th>AKSI</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for game in games %}
                        <tr>
                            <td style="font-weight: 800;">{{ game.created_at }}</td>
                            <td>
                                {% if game.is_active %}
                                <span class="badge" style="background: #60a5fa;">ACTIVE</span>
                                {% else %}
                                <span class="badge" style="background: #f87171;">FINISHED</span>
                                {% endif %}
                            </td>
                            <td style="font-weight: 900; color: #10b981;">{{ game.winner_name or '-' }}</td>
                            <td>
                                <a href="/remi/{{ game.id }}" class="btn btn-sm" style="background: var(--main);">BUKA</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- New Game Modal -->
    <div id="newGameModal" class="modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div class="card" style="width: 100%; max-width: 500px; background: white;">
            <h2 style="font-weight: 900; margin-bottom: 2rem;">MULAI GAME BARU</h2>
            <form action="/remi/new" method="post" style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="text" name="p1" placeholder="Nama Pemain 1" class="form-input" required>
                <input type="text" name="p2" placeholder="Nama Pemain 2" class="form-input" required>
                <input type="text" name="p3" placeholder="Nama Pemain 3" class="form-input" required>
                <input type="text" name="p4" placeholder="Nama Pemain 4" class="form-input" required>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">MULAI SEKARANG</button>
                    <button type="button" class="btn" style="background: #f87171;" onclick="document.getElementById('newGameModal').style.display='none'">BATAL</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
