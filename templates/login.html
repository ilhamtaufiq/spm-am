<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - AMS SUPER APP</title>
    <link rel="stylesheet" href="/static/style.css?v=1.3">
    <style>
        body {
            background-color: var(--main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: var(--white);
            padding: 4rem 3rem;
            border: var(--border-width) solid var(--black);
            border-radius: var(--radius);
            box-shadow: 15px 15px 0px 0px var(--black);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }
        .login-card::before {
            content: "AKSES AMAN CUY";
            position: absolute;
            top: -20px;
            left: 20px;
            background: #000;
            color: #fff;
            padding: 5px 15px;
            font-weight: 900;
            font-size: 0.8rem;
            border-radius: 5px;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .logo-text {
            font-size: 5rem;
            font-weight: 900;
            line-height: 0.8;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }
        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; text-transform: uppercase; }
        p { font-weight: 600; opacity: 0.7; }

        .form-group { margin-bottom: 2rem; }
        label { display: block; font-size: 1.1rem; font-weight: 900; margin-bottom: 0.8rem; text-transform: uppercase; }

        .btn-login {
            width: 100%;
            padding: 1.5rem;
            background: var(--accent);
            color: var(--black);
            border: var(--border-width) solid var(--black);
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            box-shadow: 6px 6px 0px 0px var(--black);
            text-transform: uppercase;
        }

        .btn-login:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0px 0px var(--black);
            background: #fcd34d;
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 1.5rem;
            border-radius: 12px;
            font-weight: 900;
            margin-bottom: 2rem;
            text-align: center;
            border: 3px solid #b91c1c;
            box-shadow: 4px 4px 0px #000;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header">
            <div class="logo-text">AMS<br><span style="color: var(--main-dark);">SUPER</span></div>
            <h1>KHUSUS ADMIN AJA</h1>
            <p>Halo lagi, masukin ID lu di bawah</p>
        </div>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">ID KOMANDAN</label>
                <input type="text" id="username" name="username" placeholder="Masukan Username" required autofocus class="form-input" style="background: #f8fafc; font-size: 1.2rem; padding: 1.2rem;">
            </div>
            <div class="form-group">
                <label for="password">KODE RAHASIA</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required class="form-input" style="background: #f8fafc; font-size: 1.2rem; padding: 1.2rem;">
            </div>
            <button type="submit" class="btn-login">GAS MASUK!</button>
        </form>

        <div style="margin-top: 3rem; text-align: center; font-weight: 900; font-size: 0.8rem; opacity: 0.5;">
            &copy; 2026 AMS DISPERKIM CIANJUR
        </div>
    </div>
</body>
</html>
