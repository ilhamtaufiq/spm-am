services:
  app:
    build: .
    # Ports removed to avoid conflict with Coolify Proxy. 
    # Coolify will automatically proxy to the internal port 80.
    expose:
      - 3000
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - SESSION_SECRET=spm-cianjur-super-secret-key-2026
      - DATABASE_URL=sqlite:///./data/spm_am.db
    labels:
      - "coolify.port=3000"
    networks:
      - coolify
    restart: always

networks:
  coolify:
    external: true

volumes:
  data:
