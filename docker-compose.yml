services:
  app:
    build:
      context: .
      args:
        - COOLIFY_URL=${COOLIFY_URL:-}
        - COOLIFY_FQDN=${COOLIFY_FQDN:-}
    expose:
      - 80
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-spm-cianjur-super-secret-key-2026}
      - DATABASE_URL=sqlite:///./data/spm_am.db
      - PORT=80
    labels:
      - "coolify.port=80"
    networks:
      - coolify
    restart: always

networks:
  coolify:
    external: true

volumes:
  data:
